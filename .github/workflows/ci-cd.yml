name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Ejecutar tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar tests
        run: ./mvnw test

  build-docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t insurance-platform-api:${{ github.sha }} .