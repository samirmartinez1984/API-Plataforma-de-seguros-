spring.application.name=insurance-platform-springboot

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# MySQL Database Configuration
# sincronizado con America/Bogota para evitar desfase horario
spring.datasource.url=jdbc:mysql://localhost:3306/plataforma_seguros?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging Configuration
logging.level.root=INFO
logging.level.com.insurance_platform_springboot=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# SpringDoc OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Seguridad JWT
app.jwt.secret=${JWT_SECRET:zdtlYpXvS6v8m4b9q2w5z8x3c1v4b7n0m1a4s7d0f3g6h9j2k5l8p1o4i7u0y3t6}
app.jwt.expiration=86400000

# Actuator - Monitoreo
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized