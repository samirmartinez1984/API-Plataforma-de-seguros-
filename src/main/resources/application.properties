spring.application.name=insurance-platform-springboot

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080
server.servlet.context-path=/api

# ===================================================================
# DATABASE CONFIGURATION (MySQL)
# ===================================================================
# La zona horaria se establece en America/Bogota para consistencia en las fechas.
spring.datasource.url=jdbc:mysql://localhost:3306/plataforma_seguros?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
# Las credenciales se obtienen de variables de entorno para mayor seguridad.
# Si no se definen, se usan 'root' y 'admin' como valores por defecto.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate # Valida el esquema de la BD contra las entidades al arrancar.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ===================================================================
# FLYWAY DATABASE MIGRATION
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true # Crea una línea base si la BD no está vacía.
spring.flyway.locations=classpath:db/migration # Ubicación de los scripts de migración.

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.root=INFO
logging.level.com.insurance_platform_springboot=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================================================
# SWAGGER / OPENAPI DOCUMENTATION
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===================================================================
# JWT SECURITY CONFIGURATION
# ===================================================================
# El secreto JWT se obtiene de una variable de entorno. Usar un valor largo y aleatorio.
app.jwt.secret=${JWT_SECRET:zdtlYpXvS6v8m4b9q2w5z8x3c1v4b7n0m1a4s7d0f3g6h9j2k5l8p1o4i7u0y3t6}
app.jwt.expiration=86400000 # 24 horas en milisegundos

# ===================================================================
# ACTUATOR - APPLICATION MONITORING
# ===================================================================
# Exponer endpoints específicos para monitoreo.
# 'health' e 'info' están configurados como públicos en SecurityConfig.
management.endpoints.web.exposure.include=health,info,metrics
# Mostrar detalles completos en el endpoint /health solo a usuarios autorizados (ADMIN).
management.endpoint.health.show-details=when-authorized

# ===================================================================
# EMAIL (SMTP) CONFIGURATION
# ===================================================================
# Configuración para enviar correos a través de un servidor SMTP (ej. Gmail).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Las credenciales de correo se deben proporcionar como variables de entorno.
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
# Propiedades adicionales para la conexión segura.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true