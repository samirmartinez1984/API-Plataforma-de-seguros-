# Configuración de Base de Datos H2 (En Memoria)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibérnate: Crear las tablas automáticamente para los tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Desactivar Flyway en los tests para ganar velocidad (usaremos ddl-auto)
spring.flyway.enabled=false

# Clave secreta fija para los tests
